# Claude PR 자동 리뷰 (#② 완전 자동화)
# PR이 열리면 Claude가 .claude/skills/pr-review 절차로 리뷰하고 코멘트를 게시한다.
#
# 사전 준비 (저장소 관리자):
#   1. Claude GitHub App 설치: https://github.com/apps/claude → 이 저장소에 설치
#   2. 로컬 터미널에서 `claude setup-token` 실행 → 발급된 OAuth 토큰 복사
#   3. 저장소 Settings → Secrets and variables → Actions → New repository secret
#      이름: CLAUDE_CODE_OAUTH_TOKEN / 값: 2에서 복사한 토큰
#
# 비용 참고: Claude Pro/Max 구독 사용량에서 차감된다 (별도 API 과금 없음).
# 대신 토큰 소유자의 개인 사용 한도를 공유하므로, 커밋 푸시마다 재리뷰(types에
# synchronize 추가)는 한도를 빨리 소모한다. 아래 concurrency가 중복 실행은 취소해준다.

name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GDD·기존 코드와 대조하고 git 이력을 조회하기 위해 전체 이력 필요

      - name: Claude 리뷰 실행
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR 번호: ${{ github.event.pull_request.number }}

            .claude/skills/pr-review/SKILL.md 의 절차에 따라 이 PR을 리뷰하라.
            단, CI 환경이므로 다음을 조정한다:
            - PR 브랜치는 이미 체크아웃되어 있다. gh pr checkout과 원래 브랜치 복귀 절차는 생략.
            - 스킬에 정의된 대로 .cs 파일 diff를 기본으로 읽는다. 변경 파일 목록은
              `git diff --name-only origin/${{ github.base_ref }}...HEAD`,
              스크립트 diff는 `git diff origin/${{ github.base_ref }}...HEAD -- '*.cs'`로 얻을 것.
              씬(.unity)/애니메이션/에셋 등 비스크립트 파일은 어떤 이유로도 내용을 읽지 말고
              경로 목록만 리포트의 "리뷰 제외된 파일" 항목에 기재할 것.
              단 프리팹(.prefab)은 스킬 규칙대로 diff 150줄 이하일 때만 읽어 배선을 검토한다.
            - Unity Editor가 없으므로 컴파일 검사는 스킬에 정의된 정적 검사(깨진 참조·시그니처 불일치 탐색)로
              대체하고, 리포트의 컴파일 항목에 "CI 정적 검사만 수행 — 로컬 Unity 컴파일 확인 필요"를 명시할 것.
            - 리포트는 --comment 플래그가 주어진 것으로 간주해 gh pr comment로 PR에 게시할 것
              (CI에는 확인해줄 사용자가 없으므로 게시 전 확인 절차는 생략).
            - 특정 코드 라인에 해당하는 지적(깨진 참조, GDD 규칙 위반, 컨벤션 위반)은
              인라인 코멘트로도 남길 것.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status),mcp__github_inline_comment__create_inline_comment"
